[project]
name = "minigpt"
version = "0.1.0"
description = "Small-scale LLM project"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "torch",
  "datasets",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"