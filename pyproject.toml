[project]
name = "minigpt"
version = "0.1.0"
description = "Small-scale LLM project"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3.0",
  "torch>=2.1,<3.0",
  "datasets>=2.14,<5.0",
  "matplotlib>=3.7,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=7.0,<10.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]